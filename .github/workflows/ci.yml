name: CI
on:
  push:
  pull_request:

jobs:
  web-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm install --no-frozen-lockfile
      - run: node --check scripts/flutter-dev.mjs
      - run: node --check scripts/ios-device.mjs
      - run: pnpm test
      - run: pnpm build

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  deploy-worker:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - web-worker
      - flutter
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check deploy secrets
        id: deploy-auth
        shell: bash
        run: |
          ready=true
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Cloudflare deploy skipped: missing CLOUDFLARE_API_TOKEN"
            ready=false
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Cloudflare deploy skipped: missing CLOUDFLARE_ACCOUNT_ID"
            ready=false
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
      - if: steps.deploy-auth.outputs.ready == 'true'
        run: pnpm install --no-frozen-lockfile
      - name: Deploy Cloudflare Worker
        if: steps.deploy-auth.outputs.ready == 'true'
        run: pnpm deploy
