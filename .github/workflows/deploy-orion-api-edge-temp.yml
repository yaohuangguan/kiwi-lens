name: Deploy Orion API Edge (temporary)

on:
  push:
    paths:
      - ".github/workflows/deploy-orion-api-edge-temp.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout Orion API
        uses: actions/checkout@v4
        with:
          repository: yaohuangguan/new-bananaboom-api-2025
          ref: master
          path: orion-api

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: orion-api/pnpm-lock.yaml

      - name: Deploy API gateway
        working-directory: orion-api/cloudflare/orion-api-gateway
        run: pnpm dlx wrangler@4.138.0 deploy
