openapi: 3.0.3
info:
  title: Kiwi Lens API
  version: 0.1.0
  description: Shared HTTP contract for the PWA and a future iOS client.
servers:
  - url: /api
paths:
  /health:
    get:
      summary: API and camera cache status
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  cameraCount: { type: integer }
                  syncStatus: { type: string, enum: [seed, live, stale] }
  /cameras:
    get:
      summary: All fixed safety cameras and source freshness
      responses:
        '200':
          description: Camera collection
          content:
            application/json:
              schema:
                type: object
                required: [cameras, sourceUpdatedAt, syncStatus]
                properties:
                  cameras:
                    type: array
                    items: { $ref: '#/components/schemas/Camera' }
                  sourceUpdatedAt: { type: string, format: date }
                  checkedAt: { type: string, format: date-time, nullable: true }
                  syncStatus: { type: string, enum: [seed, live, stale] }
                  syncError: { type: string, nullable: true }
                  source: { type: string, format: uri }
  /parking:
    get:
      summary: AT Open GIS car parks within 1.5 km of a New Zealand coordinate
      description: Auckland Transport locations and static capacity only; live availability is not asserted. Returns an empty array outside AT coverage.
      parameters:
        - in: query
          name: at
          required: true
          description: longitude,latitude
          schema: { type: string }
      responses:
        '200':
          description: Nearby AT parking locations
          content:
            application/json:
              schema:
                type: object
                properties:
                  source: { type: string }
                  sourceUrl: { type: string, format: uri }
                  places:
                    type: array
                    items: { $ref: '#/components/schemas/ParkingPlace' }
        '400': { description: Invalid coordinate }
        '502': { description: AT source temporarily unavailable }
  /search:
    get:
      summary: Search addresses within New Zealand
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string, minLength: 3, maxLength: 120 }
      responses:
        '200':
          description: Matching places
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    label: { type: string }
                    latitude: { type: number }
                    longitude: { type: number }
  /route:
    get:
      summary: Driving route with turn steps
      parameters:
        - in: query
          name: from
          required: true
          description: longitude,latitude
          schema: { type: string }
        - in: query
          name: to
          required: true
          description: longitude,latitude
          schema: { type: string }
      responses:
        '200':
          description: Route
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Route' }
components:
  schemas:
    ParkingPlace:
      type: object
      required: [id, source, name, address, coordinate, distanceMeters]
      properties:
        id: { type: string }
        source: { type: string, enum: [at] }
        name: { type: string }
        address: { type: string }
        coordinate:
          type: array
          description: longitude,latitude
          minItems: 2
          maxItems: 2
          items: { type: number }
        distanceMeters: { type: number }
        totalSpaces: { type: integer, nullable: true, description: Published capacity, not live availability }
        mobilitySpaces: { type: integer, nullable: true }
        clearanceMeters: { type: number, nullable: true }
    Camera:
      type: object
      required: [id, name, region, suburb, location, type, latitude, longitude, source, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        region: { type: string }
        suburb: { type: string }
        location: { type: string }
        type: { type: string, enum: ['Spot speed', 'Average speed', 'Red light'] }
        latitude: { type: number }
        longitude: { type: number }
        source: { type: string, format: uri }
        updatedAt: { type: string, format: date }
    Route:
      type: object
      properties:
        coordinates:
          type: array
          description: Polyline points in [longitude, latitude] order
          items:
            type: array
            minItems: 2
            maxItems: 2
            items: { type: number }
        distance: { type: number, description: Metres }
        duration: { type: number, description: Seconds }
        steps:
          type: array
          items:
            type: object
            properties:
              distance: { type: number }
              duration: { type: number }
              name: { type: string }
              maneuver: { type: string }
              modifier: { type: string }
              instruction: { type: string }
              location:
                type: array
                minItems: 2
                maxItems: 2
                items: { type: number }
              lanes:
                type: array
                description: OSRM lane guidance when the route source provides it.
                items:
                  type: object
                  required: [indications, valid]
                  properties:
                    indications:
                      type: array
                      items: { type: string }
                    valid: { type: boolean }
